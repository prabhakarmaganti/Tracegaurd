[project]
name = "traceguard"
version = "1.0.0"
description = "TraceGuard - Manufacturing Traceability & Recall Containment System"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "qrcode[pil]>=7.4.2",
    "reportlab>=4.1.0",
    "jinja2>=3.1.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.2",
]

[tool.vercel]
entrypoint = "api.index:app"

[tool.vercel.fastapi.static]
cdn = true
